name: CI

# Verify-only. Gates run once, locally, by the steward: `make rubric` executes
# them in the pinned Linux producer and writes the records under `evidence/`,
# which travel in the pull request as a records-only commit. This workflow
# re-derives the input digests of this tree and fails when the committed record
# no longer applies, so a stale or missing record blocks the pull request with
# "produce evidence locally". It executes no gate, runs no package manager and
# holds no credential beyond the read-only token.
#
# No gate runs on a push to staging, premain or main, and none runs on a pull
# request into premain or main: staging is where gates are verified, and a
# merge promotes the tree the pull request already verified. The release
# workflows keep their own raster re-check as artifact hygiene, bound to the
# bytes they publish.
on:
  pull_request:
    branches: [staging]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evidence:
    name: Evidence verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify the recorded gate set
        run: bash scripts/evidence/verify-gate.sh --gate rubric
